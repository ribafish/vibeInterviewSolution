name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gradle-version: [7.6.4, 8.10, wrapper]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle ${{ matrix.gradle-version }}
        if: matrix.gradle-version != 'wrapper'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle-version }}

      - name: Setup Gradle (wrapper)
        if: matrix.gradle-version == 'wrapper'
        uses: gradle/actions/setup-gradle@v4

      - name: Run checks
        run: |
          if [ "${{ matrix.gradle-version }}" = "wrapper" ]; then
            ./gradlew check --stacktrace --warning-mode=fail
          else
            gradle check --stacktrace --warning-mode=fail
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.gradle-version }}
          path: |
            **/build/reports/tests
            **/build/test-results
          if-no-files-found: ignore
