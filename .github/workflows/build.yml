name: Build - codex

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gradle-version: [7.6.4, 8.14.3, 9.2.1]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle ${{ matrix.gradle-version }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle-version }}

      - name: Run checks
        run: |
          gradle check --stacktrace --warning-mode=fail

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.gradle-version }}
          path: |
            **/build/reports/tests
            **/build/test-results
          if-no-files-found: ignore
